services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lic
      POSTGRES_PASSWORD: lic
      POSTGRES_DB: lic
    ports:
      - "5433:5432"
    volumes:
      - lic_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lic -d lic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lic_db:
