# Карточки темы «Service Worker и PWA». Ключи не переименовывать.

- key: sw-def
  type: term
  front: Service Worker
  back: Воркер-посредник между страницами сайта и сетью. Перехватывает запросы (`fetch`), получает push и фоновые события. DOM недоступен, работает только по HTTPS, жизнью управляет браузер.
  reverse: true

- key: sw-lifecycle
  type: qa
  front: Жизненный цикл Service Worker?
  back: |
    - install — заранее положить файлы в кэш
    - waiting — ждать, пока закроются вкладки со старой версией
    - activate — удалить старые кэши
    - работа — события fetch, message, push
    - остановка в простое, запуск по новому событию

- key: sw-waiting
  type: qa
  front: Почему новая версия Service Worker не применяется сразу?
  back: Она ждёт, пока закроются все вкладки со старой, — чтобы страница не работала с двумя воркерами. `skipWaiting()` пропускает ожидание; безопаснее показать «Доступно обновление» и перезагрузить по согласию.

- key: sw-stopped
  type: qa
  front: Можно ли хранить состояние в переменных Service Worker?
  back: Нет. Браузер останавливает воркер в простое, и глобальные переменные теряются. Состояние — в IndexedDB или Cache Storage.

- key: cache-first
  type: term
  front: Cache first
  back: Сначала кэш, при промахе — сеть с записью в кэш. Для файлов, которые под этим адресом не меняются, — статика с хешем в имени, шрифты.

- key: network-first
  type: term
  front: Network first
  back: Сначала сеть с таймаутом, при ошибке — копия из кэша. Для HTML и данных, где важна свежесть, но нужен офлайн.

- key: stale-while-revalidate
  type: term
  front: Stale-while-revalidate
  back: Сразу отдать копию из кэша и в фоне обновить кэш из сети. Для аватаров, списков, ленты — где отставание на один визит не страшно.

- key: wait-until
  type: qa
  front: Зачем `event.waitUntil(promise)`?
  back: Чтобы браузер не остановил воркер, пока идёт работа — установка, уборка кэшей, фоновое обновление. Без него фоновая работа после ответа может оборваться.

- key: sw-first-visit
  type: qa
  front: Управляет ли Service Worker страницей на первом визите?
  back: Нет — страница загрузилась до регистрации. Управление начнётся со следующей навигации или после `clients.claim()` при активации.

- key: sw-stuck-version
  type: qa
  front: Как пользователи «застревают» на старой версии и как это исправить?
  back: Cache first для HTML или долгий HTTP-кэш у `sw.js`. Исправить — network first для HTML, короткий кэш для `sw.js`, а в аварии — `Clear-Site-Data` или воркер, который удаляет кэши и себя.

- key: sw-security
  type: qa
  front: Чем опасен скомпрометированный Service Worker?
  back: Перехватывает и подменяет все запросы сайта и переживает закрытие вкладки. Защита — отсутствие XSS, CSP, только свой origin и HTTPS; аварийный выключатель — `Clear-Site-Data`.

- key: pwa
  type: term
  front: PWA
  back: Сайт, который устанавливается как приложение — манифест (`name`, иконки, `display`, `start_url`), Service Worker с офлайн-поведением и HTTPS. На iOS push — только у установленных приложений.
