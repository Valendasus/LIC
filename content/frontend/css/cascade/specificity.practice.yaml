# Практика темы «Каскад, специфичность и наследование».

- key: order-cascade
  kind: order
  prompt: Расставьте шаги каскада в порядке, в котором браузер их проверяет.
  steps:
    - Источник и важность (`!important`)
    - Контекст (Shadow DOM)
    - Стили в атрибуте `style`
    - Слои `@layer`
    - Специфичность селектора
    - Порядок в коде
  explain: Браузер останавливается на первом шаге, где у объявлений есть разница. Специфичность — только пятый шаг.

- key: order-specificity
  kind: order
  prompt: Расставьте селекторы от самого слабого к самому сильному.
  steps:
    - '`:where(#nav) a`'
    - '`ul li a`'
    - '`.nav a`'
    - '`.nav .item a:hover`'
    - '`#nav a`'
  explain: (0,0,1) → (0,0,3) → (0,1,1) → (0,3,1) → (1,0,1). У `:where()` нулевая специфичность, а один id сильнее любого числа классов.

- key: quiz-who-wins
  kind: quiz
  question: Какого цвета будет ссылка?
  code: |
    <nav id="top"><a class="link" href="/">Главная</a></nav>

    #top a     { color: green; }
    .link      { color: red !important; }
    nav .link  { color: blue; }
  options:
    - text: Красная
      correct: true
    - text: Зелёная
      why: У `#top a` самая высокая специфичность, но важность проверяется раньше специфичности.
    - text: Синяя
      why: '`nav .link` объявлено последним, но порядок в коде — последний шаг каскада.'
  explain: На шаге «источник и важность» `!important` побеждает обычные объявления, до специфичности дело не доходит.

- key: quiz-layers
  kind: quiz
  question: |
    Какой фон у кнопки?
  code: |
    @layer base, components;

    @layer components { .btn { background: blue; } }
    @layer base { #app .btn { background: gray; } }
    .btn { background: green; }
  options:
    - text: Зелёный
      correct: true
    - text: Синий
      why: '`components` — самый поздний слой, но обычные стили вне слоёв сильнее любых слоёв.'
    - text: Серый
      why: 'Высокая специфичность внутри слоя не помогает: слои сравниваются раньше специфичности.'
  explain: Обычное объявление вне слоёв сильнее всех слоёв. С `!important` было бы наоборот.

- key: quiz-is-where
  kind: quiz
  question: 'Какая специфичность у селектора `:is(.a, #b) span`?'
  options:
    - text: (1, 0, 1)
      correct: true
    - text: (0, 1, 1)
      why: '`:is()` берёт не первый и не самый слабый аргумент, а самый специфичный — `#b`.'
    - text: (0, 0, 1)
      why: Так было бы с `:where()` — он всегда весит ноль.
    - text: (1, 1, 1)
      why: Аргументы `:is()` не суммируются, берётся только самый специфичный.
  explain: '`:is()`, `:not()` и `:has()` получают специфичность самого специфичного аргумента.'

- key: quiz-inherited
  kind: quiz
  question: Какие свойства наследуются по умолчанию? Отметьте все.
  options:
    - text: '`color`'
      correct: true
    - text: '`font-family`'
      correct: true
    - text: '`line-height`'
      correct: true
    - text: '`margin`'
      why: Отступы не наследуются, иначе каждый вложенный блок получал бы отступ родителя.
    - text: '`border`'
      why: Рамки не наследуются.
  explain: Наследуются в основном текстовые свойства. Для остальных можно явно указать `inherit`.

# ── Задачи на код ─────────────────────────────────────────────────────────
# Специфичность — это тройка чисел, и её удобно «потрогать» кодом.

- key: code-compare
  kind: code
  level: easy
  title: Сравнить специфичность
  prompt: |
    Специфичность записана тройкой `[a, b, c]`: id, классы (атрибуты и псевдоклассы), типы (и псевдоэлементы).

    Напишите `compareSpecificity(x, y)`: возвращает `1`, если `x` сильнее, `-1`, если слабее, и `0`, если равны.
  starter: |
    function compareSpecificity(x, y) {
      return 0
    }
  hints:
    - Как сравнивают версии программ «1.10.0» и «1.9.5»? Так же — по разрядам слева направо.
  tests: |
    test('id сильнее любого числа классов', () => {
      expect(compareSpecificity([1, 0, 0], [0, 15, 0])).toBe(1)
    })
    test('класс сильнее любого числа типов', () => {
      expect(compareSpecificity([0, 0, 9], [0, 1, 0])).toBe(-1)
    })
    test('при равенстве старших сравниваются младшие', () => {
      expect(compareSpecificity([0, 2, 1], [0, 2, 3])).toBe(-1)
    })
    test('равные', () => {
      expect(compareSpecificity([1, 2, 3], [1, 2, 3])).toBe(0)
    })
  solution: |
    function compareSpecificity(x, y) {
      for (let i = 0; i < 3; i++) {
        if (x[i] !== y[i]) return x[i] > y[i] ? 1 : -1
      }
      return 0
    }
  explain: |
    Разряды не «переносятся»: 15 классов не дают одного id. Поэтому специфичность сравнивают покомпонентно слева направо, как номера версий, а не складывают в одно число.

    Старая запись «id = 100, класс = 10» неверна ровно поэтому: 11 классов не сильнее одного id.

- key: code-specificity
  kind: code
  level: hard
  title: Посчитать специфичность селектора
  prompt: |
    Напишите `specificity(selector)` для одного сложного селектора (без запятых на верхнем уровне). Вернуть `[a, b, c]`.
    - `#id` → a.
    - `.class`, `[attr]`, псевдоклассы `:hover`, `:nth-child(2n)` → b.
    - Типы `div`, псевдоэлементы `::before` и старые `:before`, `:after`, `:first-line`, `:first-letter` → c.
    - `*` и комбинаторы (пробел, `>`, `+`, `~`) не считаются.
    - `:is()`, `:not()`, `:has()` берут специфичность **самого сильного** аргумента.
    - `:where()` всегда даёт ноль.

    Функция `compareSpecificity` из прошлой задачи уже объявлена ниже — пользуйтесь.
  starter: |
    function compareSpecificity(x, y) {
      for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i] ? 1 : -1
      return 0
    }

    function specificity(selector) {
      return [0, 0, 0]
    }
  hints:
    - 'Регулярное выражение на весь селектор не справится со вложенными `:is(…)`. Проще идти по строке символ за символом.'
    - 'По первому символу понятно, что дальше: `#` — id, `.` — класс, `[` — атрибут до `]`, `:` — псевдо, буква — тип.'
    - 'Для `:is(…)` нужен конец скобки с учётом вложенности (счётчик глубины) и разбиение аргументов по запятым верхнего уровня. Каждый аргумент — рекурсивный вызов `specificity`.'
    - 'Ключевое: у `:is`/`:not`/`:has` к счёту добавляется максимум по аргументам, а не сумма; `:where` пропускается целиком.'
  tests: |
    const cases = [
      ['a', [0, 0, 1]],
      ['*', [0, 0, 0]],
      ['#nav .item a:hover', [1, 2, 1]],
      ['ul li::before', [0, 0, 3]],
      ['p:first-line', [0, 0, 2]],
      ['input[type="text"]:focus', [0, 2, 1]],
      ['div > p + span ~ em', [0, 0, 4]],
      ['li:nth-child(2n + 1)', [0, 1, 1]],
      [':is(#a, .b) p', [1, 0, 1]],
      [':where(#a .b) p', [0, 0, 1]],
      ['a:not(.x, #y)', [1, 0, 1]],
      ['.card:has(> img.cover)', [0, 2, 1]],
      [':is(:not(#x), .y)', [1, 0, 0]],
    ]
    for (const [selector, expected] of cases) {
      test(selector, () => expect(specificity(selector)).toEqual(expected))
    }
  solution: |
    function compareSpecificity(x, y) {
      for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i] ? 1 : -1
      return 0
    }

    const LEGACY_ELEMENTS = ['before', 'after', 'first-line', 'first-letter']
    const isNameChar = (ch) => /[\w-]/.test(ch) || ch > '\x7f'

    function readName(s, i) {
      while (i < s.length && isNameChar(s[i])) i++
      return i
    }

    // Позиция сразу после парной закрывающей скобки.
    function closeParen(s, i) {
      let depth = 0
      for (; i < s.length; i++) {
        if (s[i] === '(') depth++
        if (s[i] === ')' && --depth === 0) return i + 1
      }
      return s.length
    }

    // Разбиение по запятым верхнего уровня: «#a, :is(.b, .c)» → два аргумента.
    function splitArgs(s) {
      const parts = []
      let depth = 0
      let start = 0
      for (let i = 0; i < s.length; i++) {
        if (s[i] === '(') depth++
        if (s[i] === ')') depth--
        if (s[i] === ',' && depth === 0) {
          parts.push(s.slice(start, i))
          start = i + 1
        }
      }
      return [...parts, s.slice(start)]
    }

    function specificity(selector) {
      const s = selector.trim()
      const total = [0, 0, 0]
      const add = ([a, b, c]) => {
        total[0] += a
        total[1] += b
        total[2] += c
      }
      let i = 0
      while (i < s.length) {
        const ch = s[i]
        if (ch === '#') {
          add([1, 0, 0])
          i = readName(s, i + 1)
        } else if (ch === '.') {
          add([0, 1, 0])
          i = readName(s, i + 1)
        } else if (ch === '[') {
          add([0, 1, 0])
          i = s.indexOf(']', i) + 1
        } else if (ch === ':' && s[i + 1] === ':') {
          add([0, 0, 1])
          i = readName(s, i + 2)
          if (s[i] === '(') i = closeParen(s, i)
        } else if (ch === ':') {
          const end = readName(s, i + 1)
          const name = s.slice(i + 1, end).toLowerCase()
          i = end
          if (s[i] === '(') {
            const after = closeParen(s, i)
            const inner = s.slice(i + 1, after - 1)
            i = after
            if (name === 'where') continue
            if (['is', 'not', 'has', 'matches'].includes(name)) {
              add(splitArgs(inner).map(specificity).reduce((best, next) => (compareSpecificity(next, best) > 0 ? next : best)))
            } else add([0, 1, 0])
          } else add(LEGACY_ELEMENTS.includes(name) ? [0, 0, 1] : [0, 1, 0])
        } else if (isNameChar(ch)) {
          add([0, 0, 1])
          i = readName(s, i)
        } else i++ // *, пробелы и комбинаторы
      }
      return total
    }
  explain: |
    **Почему посимвольно.** Селекторы вложенные: `:is(:not(#x), .y)`. Регулярка не считает парные скобки, а проход со счётчиком глубины — легко.

    **Три правила, которые чаще всего забывают:**
    - `:is`, `:not`, `:has` сами по себе ничего не весят, но приносят **максимум** по своим аргументам. `:not(.x, #y)` весит как id.
    - `:where` всегда ноль — на этом построены «мягкие» сбросы и базовые стили библиотек, которые легко переопределить.
    - Комбинаторы и `*` не весят ничего.

    **Где проверить себя:** спецификация Selectors Level 4, раздел «Calculating a selector’s specificity», и DevTools — при наведении на селектор во вкладке Styles показывается его специфичность.

    **Чего здесь нет** ради простоты: `:nth-child(2n of .x)` добавляет специфичность аргумента `of`, а экранированные символы вроде `.a\:b` читаются как часть имени.

- key: quiz-important-layers
  kind: quiz
  question: 'Слои объявлены как `@layer base, components;`. В обоих есть `color: red !important` и `color: blue !important` для одного элемента: в `base` — красный, в `components` — синий. Какой цвет победит?'
  options:
    - text: Красный — для `!important` порядок слоёв обращается, и ранний слой сильнее
      correct: true
    - text: Синий — более поздний слой всегда сильнее
      why: Это верно для обычных объявлений. Для `!important` порядок обратный, чтобы базовый слой мог защитить важные правила.
    - text: Победит правило с большей специфичностью, слои не важны
      why: Слои сравниваются раньше специфичности.
    - text: Синий — потому что `!important` в последнем слое не перебить
  explain: 'Обычные объявления: поздний слой сильнее раннего, а стили вне слоёв сильнее любых слоёв. С `!important` всё наоборот: ранний слой сильнее позднего, а важные стили в слоях сильнее важных стилей вне слоёв.'

- key: quiz-unset
  kind: quiz
  question: 'Что сделает `color: unset` у элемента, родитель которого `color: green`?'
  options:
    - text: Станет зелёным — для наследуемого свойства `unset` работает как `inherit`
      correct: true
    - text: Станет чёрным — `unset` всегда сбрасывает к начальному значению
      why: Так ведёт себя `initial`. `unset` для наследуемых свойств наследует, для ненаследуемых — сбрасывает.
    - text: Возьмёт значение из стилей браузера по умолчанию
      why: Так ведёт себя `revert`.
    - text: Объявление будет проигнорировано
  explain: '`inherit` — значение родителя. `initial` — начальное значение свойства из спецификации. `unset` — `inherit` для наследуемых свойств (`color`, `font-*`), `initial` для остальных. `revert` — откат к стилям браузера.'

- key: quiz-not-specificity
  kind: quiz
  question: Какая специфичность у селектора `:not(#menu, .item)`?
  options:
    - text: '(1, 0, 0) — берётся самый сильный аргумент'
      correct: true
    - text: '(0, 1, 0) — `:not` считается как псевдокласс'
      why: Сам `:not` не добавляет специфичности, её задаёт аргумент.
    - text: '(1, 1, 0) — аргументы складываются'
      why: Аргументы не складываются, выбирается самый сильный.
    - text: '(0, 0, 0) — как у `:where`'
      why: Нулевая специфичность только у `:where()`.
  explain: '`:is()`, `:not()` и `:has()` берут специфичность самого сильного аргумента из списка. `:where()` всегда даёт ноль — поэтому им удобно писать сбрасываемые базовые стили.'

- key: order-cascade-full
  kind: order
  prompt: Расставьте критерии каскада в порядке, в котором браузер их сравнивает, когда два объявления спорят за одно свойство.
  steps:
    - Источник и важность (стили браузера, автора, !important)
    - Встроенный стиль в атрибуте style
    - Каскадные слои @layer
    - Специфичность селектора
    - Близость корня @scope
    - Порядок появления в коде
  explain: Следующий критерий сравнивается, только если по предыдущему ничья. Поэтому слой сильнее специфичности, а порядок в коде решает в самую последнюю очередь.

- key: code-beats
  kind: code
  level: easy
  title: Кто сильнее с учётом style и !important
  prompt: |
    Объявление описано объектом `{ important, inline, specificity, order }`: `important` — есть ли `!important`, `inline` — объявлено ли в атрибуте `style`, `specificity` — тройка `[a, b, c]`, `order` — номер в коде.

    Напишите `beats(x, y)`: `true`, если `x` побеждает `y`. Слоёв нет, всё — стили автора.
    - `!important` сильнее обычного.
    - При равной важности `style` сильнее любого селектора.
    - Дальше — специфичность, потом порядок: позже — сильнее.
  starter: |
    function beats(x, y) {
      return x.order > y.order
    }
  hints:
    - 'Сравнивайте по критериям сверху вниз и выходите на первом, где есть разница.'
  tests: |
    const rule = (extra) => ({ important: false, inline: false, specificity: [0, 0, 1], order: 1, ...extra })
    test('!important сильнее style', () => {
      expect(beats(rule({ important: true }), rule({ inline: true, order: 2 }))).toBe(true)
    })
    test('style сильнее id', () => {
      expect(beats(rule({ inline: true }), rule({ specificity: [1, 0, 0], order: 2 }))).toBe(true)
    })
    test('специфичность важнее порядка', () => {
      expect(beats(rule({ specificity: [0, 1, 0] }), rule({ order: 9 }))).toBe(true)
      expect(beats(rule({ order: 9 }), rule({ specificity: [0, 1, 0] }))).toBe(false)
    })
    test('при прочих равных — позже сильнее', () => {
      expect(beats(rule({ order: 2 }), rule({ order: 1 }))).toBe(true)
      expect(beats(rule({ order: 1 }), rule({ order: 2 }))).toBe(false)
    })
  solution: |
    function beats(x, y) {
      if (x.important !== y.important) return x.important
      if (x.inline !== y.inline) return x.inline
      for (let i = 0; i < 3; i++) if (x.specificity[i] !== y.specificity[i]) return x.specificity[i] > y.specificity[i]
      return x.order > y.order
    }
  explain: |
    Каскад — это сравнение по критериям по очереди: следующий критерий важен, только если по предыдущему ничья. Поэтому `!important` перебивает `style`, `style` перебивает любой id, а порядок в коде решает в последнюю очередь.

    **На собеседовании** спросят, чем перебить inline-стиль: только `!important` в стилях. Правильный ответ — не перебивать, а убрать inline-стиль или вынести его в класс.

- key: code-cascade-winner
  kind: code
  level: medium
  title: Победитель каскада со слоями
  prompt: |
    Напишите `cascadeWinner(declarations, layers)`. Каждое объявление — `{ value, important, layer, specificity, order }`: `layer` — имя слоя или `null`, если объявление вне слоёв. `layers` — имена слоёв в порядке объявления (`@layer reset, base, components`). Верните `value` победителя.

    Правила:
    - `!important` сильнее обычного.
    - Обычные: вне слоёв сильнее любого слоя; из слоёв сильнее более поздний.
    - Важные: наоборот — слой сильнее, чем вне слоёв; из слоёв сильнее более ранний.
    - Дальше — специфичность, потом порядок: позже — сильнее.
  starter: |
    function cascadeWinner(declarations, layers) {
      return declarations.at(-1).value
    }
  hints:
    - 'Сделайте функцию «вес слоя»: для обычных объявлений вне слоёв — больше всех, для важных — меньше всех.'
    - 'Для обычных вес слоя — его индекс в `layers`, для важных — минус индекс. Вне слоёв: `Infinity` для обычных и `-Infinity` для важных.'
    - 'Победитель — максимум по цепочке сравнений: важность, вес слоя, специфичность, порядок.'
  tests: |
    const d = (value, extra) => ({ value, important: false, layer: null, specificity: [0, 0, 1], order: 1, ...extra })
    const layers = ['reset', 'base', 'components']
    test('вне слоёв сильнее слоя, даже со слабым селектором', () => {
      expect(cascadeWinner([d('слой', { layer: 'components', specificity: [1, 0, 0] }), d('вне слоёв')], layers)).toBe('вне слоёв')
    })
    test('из слоёв сильнее поздний', () => {
      expect(cascadeWinner([d('components', { layer: 'components', order: 1 }), d('base', { layer: 'base', order: 2 })], layers)).toBe('components')
    })
    test('!important: ранний слой сильнее позднего и сильнее стилей вне слоёв', () => {
      const result = cascadeWinner([
        d('вне слоёв', { important: true, order: 3 }),
        d('components', { important: true, layer: 'components', order: 2 }),
        d('reset', { important: true, layer: 'reset', order: 1 }),
      ], layers)
      expect(result).toBe('reset')
    })
    test('!important сильнее обычного', () => {
      expect(cascadeWinner([d('важное', { important: true, layer: 'components' }), d('обычное', { specificity: [1, 0, 0], order: 2 })], layers)).toBe('важное')
    })
    test('в одном слое — специфичность, потом порядок', () => {
      expect(cascadeWinner([d('класс', { layer: 'base', specificity: [0, 1, 0] }), d('тип', { layer: 'base', order: 2 })], layers)).toBe('класс')
      expect(cascadeWinner([d('первое', { layer: 'base' }), d('второе', { layer: 'base', order: 2 })], layers)).toBe('второе')
    })
  solution: |
    function cascadeWinner(declarations, layers) {
      const layerWeight = (decl) => {
        if (decl.layer === null) return decl.important ? -Infinity : Infinity
        const index = layers.indexOf(decl.layer)
        return decl.important ? -index : index
      }
      const stronger = (x, y) => {
        if (x.important !== y.important) return x.important
        if (layerWeight(x) !== layerWeight(y)) return layerWeight(x) > layerWeight(y)
        for (let i = 0; i < 3; i++) if (x.specificity[i] !== y.specificity[i]) return x.specificity[i] > y.specificity[i]
        return x.order > y.order
      }
      return declarations.reduce((best, decl) => (stronger(decl, best) ? decl : best)).value
    }
  explain: |
    **Главная идея — «вес слоя»,** который переворачивается для `!important`. Так одна функция сравнения покрывает оба случая.

    **Зачем обращение для `!important`.** Базовый слой (сброс, дизайн-система) объявляется первым. Обычные его правила легко переопределить в поздних слоях. Но если базовый слой пометил что-то как важное, например доступность фокуса, поздние слои не должны это ломать — поэтому для важных порядок обратный.

    **На практике:** слои дают управлять каскадом порядком слоёв, а не гонкой специфичности и `!important`. Стили сторонних библиотек кладут в ранний слой — и свои правила побеждают их без усилий.
