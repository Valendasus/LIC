# Карточки темы «Каскад, специфичность и наследование». Ключи не переименовывать.

- key: cascade-def
  type: term
  front: Каскад
  back: Алгоритм, который выбирает одно значение свойства из всех подходящих объявлений, сравнивая их по шагам до первой разницы.
  reverse: true

- key: cascade-steps
  type: qa
  front: Шаги каскада по порядку?
  back: |
    - источник и важность (`!important`)
    - контекст (Shadow DOM)
    - атрибут `style`
    - слои `@layer`
    - специфичность
    - порядок в коде

- key: specificity-def
  type: term
  front: Специфичность
  back: Вес селектора из трёх чисел (A, B, C) — id; классы, атрибуты и псевдоклассы; теги и псевдоэлементы. Сравнивается слева направо.
  reverse: true

- key: id-vs-classes
  type: qa
  front: Перебьют ли 11 классов один id?
  back: 'Нет. (1, 0, 0) больше (0, 11, 0): сравнение заканчивается на первом числе, разряды не переносятся.'

- key: where-zero
  type: qa
  front: Какая специфичность у `:where(...)`?
  back: Нулевая, что бы ни было внутри. Удобно для базовых стилей, которые легко перебить.

- key: is-not-has
  type: qa
  front: Какая специфичность у `:is()`, `:not()` и `:has()`?
  back: Как у самого специфичного аргумента. `:is(#a, .b)` весит как id.

- key: not-counted
  type: qa
  front: Что не влияет на специфичность?
  back: Универсальный селектор `*` и комбинаторы (пробел, `>`, `+`, `~`), а также всё внутри `:where()`.

- key: spec-example-1
  type: code
  front: |
    Специфичность селектора?
    ```css
    #menu > li.active
    ```
  back: '(1, 1, 1): один id, один класс, один тег.'

- key: spec-example-2
  type: code
  front: |
    Специфичность селектора?
    ```css
    input[type="checkbox"]:checked + label::before
    ```
  back: '(0, 2, 3): атрибут и `:checked` — в B; `input`, `label` и `::before` — в C.'

- key: important-order
  type: qa
  front: Кто сильнее с `!important` — стиль сайта или стиль пользователя?
  back: Стиль пользователя. `!important` переворачивает порядок источников, чтобы пользователь (например, с настройками доступности) мог перебить сайт.

- key: layer-def
  type: term
  front: '@layer'
  back: Каскадный слой. Задаёт порядок групп стилей; слой, объявленный позже, сильнее независимо от специфичности селекторов.
  reverse: true

- key: unlayered
  type: qa
  front: Кто сильнее — обычное правило вне слоёв или в слое?
  back: Правило вне слоёв сильнее любых слоёв. С `!important` наоборот — важные объявления в слоях сильнее, и ранний слой сильнее позднего.

- key: tailwind-layers
  type: qa
  front: На каких слоях построен Tailwind 4?
  back: '`theme`, `base`, `components`, `utilities`. Поэтому утилиты перебивают компоненты за счёт порядка слоёв, а не специфичности.'

- key: inherited-props
  type: qa
  front: Какие свойства наследуются по умолчанию?
  back: В основном текстовые — `color`, `font-*`, `line-height`, `visibility`, `cursor`. Отступы, рамки и фон не наследуются.

- key: unset-revert
  type: qa
  front: Чем `unset` отличается от `revert`?
  back: '`unset` — `inherit` для наследуемых свойств и `initial` для остальных. `revert` откатывает к стилям браузера. Ещё есть `revert-layer` — к значению предыдущего слоя.'

- key: debug-style
  type: qa
  front: Стиль не применяется. Первое действие?
  back: Открыть DevTools → Styles, найти перечёркнутое правило и понять, на каком шаге каскада оно проиграло. Не добавлять `!important` вслепую.
