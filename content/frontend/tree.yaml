# ───────────────────────── Языки ─────────────────────────
- slug: javascript
  title: JavaScript
  group: Языки
  summary: Язык целиком — от приведения типов до асинхронности, памяти и метапрограммирования.
  children:
    - slug: types
      title: Типы и приведение
      children:
        - { slug: types-coercion, title: 'Примитивы, объекты и приведение типов', grade: J }
        - { slug: equality, title: 'Сравнение: ==, === и Object.is', grade: J }
    - slug: scope
      title: Области видимости и замыкания
      children:
        - { slug: scope-hoisting, title: 'Области видимости, hoisting и TDZ', grade: J }
        - slug: closures
          title: Замыкания
          grade: J
          content: true
          goals:
            - Объяснить замыкание через лексическое окружение, а не «функция помнит переменные»
            - Предсказать результат классических задач с циклом, таймером и счётчиком
            - Применять замыкания для приватного состояния, фабрик функций, debounce и мемоизации
            - Найти и исправить «устаревшее замыкание» в React-компоненте
    - { slug: this, title: 'this и способы его задать', grade: J }
    - slug: objects
      title: Объекты, прототипы и классы
      children:
        - { slug: prototypes, title: 'Прототипы и цепочка прототипов', grade: J }
        - { slug: classes, title: 'Классы, наследование, приватные поля', grade: J }
    - slug: collections
      title: Коллекции и итерация
      children:
        - { slug: arrays, title: 'Массивы и их методы', grade: J }
        - { slug: map-set, title: 'Map, Set, WeakMap, WeakRef', grade: J }
        - { slug: iteration, title: 'Протокол итерации, spread и деструктуризация', grade: J }
    - slug: async
      title: Асинхронность
      children:
        - slug: event-loop
          title: Event loop в браузере
          grade: J
          content: true
          goals:
            - Объяснить, как стек вызовов, очередь задач и очередь микрозадач работают вместе
            - Предсказать порядок вывода с setTimeout, промисами, await и queueMicrotask
            - Объяснить, почему тяжёлый синхронный код замораживает страницу и как это исправить
            - Понять, где в цикле находится отрисовка и requestAnimationFrame
        - slug: promises
          title: Промисы
          grade: J
          content: true
          goals:
            - Объяснить состояния промиса и почему исполнитель синхронный, а обработчики — нет
            - Предсказать, что вернёт каждый then в цепочке и куда пойдёт ошибка
            - Писать цепочки без потерянных return и проглоченных ошибок
            - Знать, когда нужен new Promise, и использовать withResolvers и Promise.try
            - Реализовать promisify, повтор с паузой, общий запрос и собственный промис
        - slug: async-await
          title: 'async/await и обработка ошибок'
          grade: J
          content: true
          goals:
            - Объяснить, что возвращает async-функция и какая её часть выполняется синхронно
            - Предсказать порядок вывода с await, return await и await в циклах
            - Обрабатывать ошибки через try/catch/finally, не теряя и не глотая их
            - Выбирать между последовательной и параллельной загрузкой и находить ошибку forEach(async)
            - Писать очередь задач, постраничную загрузку и опрос с таймаутом и отменой
        - slug: combinators
          title: 'Promise.all, allSettled, race, any'
          grade: J
          content: true
          goals:
            - Объяснить разницу all, allSettled, race и any, включая пустой вход и порядок результатов
            - Выбрать комбинатор под задачу и увидеть, когда не подходит ни один
            - Помнить, что комбинаторы ничего не отменяют, и отменять лишние операции через AbortController
            - Написать свои allSettled, any, all по ключам и подстраховочный запрос
        - slug: cancellation
          title: 'Отмена и гонки запросов'
          grade: M
          content: true
          goals:
            - Отменять запросы, обработчики и свои операции через AbortController и AbortSignal
            - Объяснить гонку ответов и три способа её решить, и почему debounce не решает
            - Делать таймаут и объединять сигналы через AbortSignal.timeout и AbortSignal.any
            - Отличать отмену от ошибки и не показывать её пользователю
            - Отменять запросы в очистке useEffect и понимать, что отмена не откатывает действие на сервере
    - { slug: modules, title: 'Модули: ESM и CommonJS', grade: J }
    - { slug: errors, title: 'Ошибки и их обработка', grade: J }
    - slug: generators
      title: 'Итераторы, генераторы, асинхронные итераторы'
      grade: M
      content: true
      goals:
        - Объяснить протокол итерации: итерируемый объект, итератор, next и done
        - Предсказать, как генератор выполняется по next, что передаёт next(x), что делают return, throw и break
        - Делать свои итерируемые объекты и обходить деревья через yield*
        - Использовать ленивость и методы итераторов ES2025 вместо промежуточных массивов
        - Писать асинхронные генераторы для постраничных данных и объяснить связь генераторов с async/await
    - { slug: immutability, title: 'Неизменяемость и копирование', grade: J }
    - { slug: regex, title: 'Регулярные выражения', grade: M }
    - { slug: dates-intl, title: 'Даты, Intl и Temporal', grade: M }
    - { slug: numbers, title: 'Числа, точность, BigInt и деньги', grade: M }
    - { slug: memory, title: 'Память, сборка мусора, утечки', grade: M }
    - { slug: functional, title: 'Функциональные приёмы', grade: M }
    - { slug: metaprogramming, title: 'Proxy, Reflect, Symbol', grade: S }
    - { slug: modern-es, title: 'Новое в ECMAScript 2024–2026', grade: M }

