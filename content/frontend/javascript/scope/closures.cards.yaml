# Карточки темы «Замыкания». Ключи не переименовывать: к ним привязано расписание повторений.

- key: closure-def
  type: term
  front: Замыкание
  back: Функция вместе со ссылкой на лексическое окружение, в котором она была создана.
  example: |
    ```js
    const add = (a) => (b) => a + b
    add(2)(3) // 5 — внутренняя функция видит a
    ```
  reverse: true

- key: lexical-env
  type: term
  front: Лексическое окружение
  back: Таблица «имя → значение» для вызова функции или блока плюс ссылка на внешнее окружение. По этой цепочке ищутся переменные.
  reverse: true

- key: lexical-scope
  type: qa
  front: Где ищет переменные функция — там, где её **создали**, или там, где **вызвали**?
  back: Там, где создали. Область видимости в JS лексическая, а не динамическая.

- key: reference-not-copy
  type: qa
  front: Замыкание хранит **копию значения** переменной или **ссылку** на неё?
  back: Ссылку на переменную. Если переменная изменится, функция увидит новое значение.

- key: new-env-per-call
  type: qa
  front: Будут ли два счётчика из двух вызовов `makeCounter()` делить одну переменную `count`?
  back: Нет. Каждый вызов функции создаёт новое окружение, у каждого счётчика своя `count`.

- key: var-loop
  type: code
  front: |
    Что выведет код?
    ```js
    for (var i = 0; i < 3; i++) {
      setTimeout(() => console.log(i))
    }
    ```
  back: |
    `3, 3, 3`. У `var` одна переменная на всю функцию; к моменту срабатывания таймеров она равна 3.

- key: let-loop
  type: qa
  front: Почему цикл с `let` и `setTimeout` выводит `0, 1, 2`?
  back: '`let` в заголовке цикла создаёт новую привязку на каждую итерацию: у каждого колбэка своя переменная.'

- key: iife
  type: term
  front: IIFE
  back: Функция, вызванная сразу при объявлении `(function () { … })()`. До `let` так создавали отдельное окружение, например на каждую итерацию цикла.

- key: private-state
  type: qa
  front: Как сделать данные приватными без классов и `#полей`?
  back: Хранить их в переменной внешней функции и вернуть наружу только функции, которые с ними работают. Снаружи переменную не достать.

- key: closure-memory
  type: qa
  front: Как замыкание может вызвать утечку памяти?
  back: Пока функция жива, живо всё, что она захватила. Забытый обработчик, таймер или подписка удерживают данные. Защита — снимать подписки при очистке.

- key: stale-closure
  type: term
  front: Устаревшее замыкание (stale closure) в React
  back: Обработчик или эффект видит значения рендера, в котором был создан, а не текущие. Например, `setInterval` в эффекте с пустыми зависимостями навсегда видит первое состояние.
  reverse: true

- key: stale-fix-updater
  type: qa
  front: Самый простой способ исправить `setCount(count + 1)` внутри интервала, созданного один раз?
  back: 'Функциональное обновление: `setCount((c) => c + 1)`. Актуальное значение передаёт React.'

- key: use-effect-event
  type: term
  front: useEffectEvent
  back: Хук React 19.2+. Возвращает функцию, которая внутри эффекта всегда видит свежие пропсы и состояние, но не требует перезапуска эффекта.
  reverse: true

- key: debounce-vs-throttle
  type: qa
  front: Чем `debounce` отличается от `throttle`?
  back: '`debounce` вызывает функцию после паузы в вызовах (поиск при наборе). `throttle` вызывает не чаще одного раза в интервал (скролл, resize).'

- key: factory-example
  type: code
  front: |
    Что такое `isInteger(1, 120)` в этом коде и почему это замыкание?
    ```js
    const isInteger = (min, max) => (value) =>
      Number.isInteger(value) && value >= min && value <= max
    ```
  back: Функция-проверка, которая помнит границы `min` и `max` из внешнего вызова. Такой приём называют фабрикой функций (каррированием).
