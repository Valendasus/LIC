# Карточки темы «Итераторы, генераторы, асинхронные итераторы». Ключи не переименовывать.

- key: generator-def
  type: term
  front: Генератор (`function*`)
  back: Функция, вызов которой не выполняет тело, а возвращает объект-генератор. Тело идёт кусками до очередного `yield` при каждом `next()`. Генератор — одновременно итератор и итерируемый.
  reverse: true

- key: yield-def
  type: term
  front: '`yield`'
  back: Приостанавливает генератор и отдаёт значение наружу. Результат выражения `yield` — аргумент следующего `next(x)`.
  reverse: true

- key: iterator-protocol
  type: qa
  front: Что такое итератор и итерируемый объект?
  back: Итерируемый — у кого есть `[Symbol.iterator]()`, возвращающий итератор. Итератор — объект с `next()`, который возвращает `{ value, done }`. `for…of`, spread и деструктуризация работают с итерируемыми.

- key: next-arg-lost
  type: qa
  front: Почему аргумент первого `next(x)` теряется?
  back: Первый `next` запускает тело до первого `yield`. Значение принимает тот `yield`, на котором генератор стоит, а до первого вызова он ещё нигде не стоит.

- key: return-throw
  type: qa
  front: Что делают `it.return(v)` и `it.throw(e)`?
  back: '`return` завершает генератор, выполнив его `finally`. `throw` бросает ошибку в место паузы — её можно поймать `try/catch` внутри генератора.'

- key: yield-star
  type: term
  front: '`yield*`'
  back: Передаёт работу другому итерируемому или генератору — его значения идут наружу как свои. Используют для рекурсивного обхода деревьев.

- key: lazy
  type: qa
  front: В чём главная польза генераторов?
  back: В ленивости. Значения вычисляются по одному и только когда их просят. Можно работать с бесконечными последовательностями, останавливать обход на найденном, обрабатывать данные по мере поступления.

- key: one-shot
  type: qa
  front: Можно ли перебрать генератор дважды?
  back: Нет, итератор одноразовый. Второй `for…of` ничего не выдаст. Чтобы перебирать много раз, делают итерируемый объект с методом `*[Symbol.iterator]()` — он создаёт новый генератор на каждый проход.

- key: break-finally
  type: qa
  front: Что происходит с генератором при `break` в `for…of`?
  back: '`for…of` вызывает `return()` у итератора. Генератор завершается, и его `finally` выполняется — так закрывают ресурсы при досрочном выходе.'

- key: async-generator
  type: term
  front: Асинхронный генератор (`async function*`)
  back: Генератор, в котором можно `await`. Его перебирают через `for await…of`. Подходит для постраничной выдачи, потоков, событий.

- key: iterator-helpers
  type: term
  front: Методы итераторов
  back: 'ES2025: `map`, `filter`, `take`, `drop`, `flatMap`, `reduce`, `toArray`, `forEach`, `some`, `every`, `find` у любого итератора, плюс `Iterator.from`. Ленивые, в отличие от методов массива. ES2026 — `Iterator.concat`.'

- key: generators-and-await
  type: qa
  front: Как `async/await` связан с генераторами?
  back: До ES2017 его делали на генераторах. `yield promise` отдавал промис исполнителю, тот ждал его и продолжал генератор через `next(value)` или `throw(error)`. Так работали библиотека `co` и код после Babel.
