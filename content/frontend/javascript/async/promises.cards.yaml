# Карточки темы «Промисы». Ключи не переименовывать.

- key: promise-def
  type: term
  front: Промис (Promise)
  back: Объект-представитель результата асинхронной операции, который появится позже. Через `then`, `catch`, `await` на него подписываются. Состояние меняется один раз — из «ожидает» в «выполнен» или «отклонён».
  reverse: true

- key: promise-states
  type: qa
  front: Какие состояния у промиса и как они меняются?
  back: |
    - `pending` — ожидает
    - `fulfilled` — выполнен со значением
    - `rejected` — отклонён с причиной

    Переход из `pending` — один раз и навсегда. Выполненный или отклонённый промис называют `settled` (завершённым).

- key: executor-sync
  type: qa
  front: Когда выполняется функция, переданная в `new Promise(…)`?
  back: Сразу и синхронно, внутри конструктора. Асинхронны только обработчики `then`, `catch`, `finally`. `resolve()` не прерывает исполнитель — код после него тоже выполнится.

- key: then-returns
  type: qa
  front: Что возвращает `.then(handler)`?
  back: |
    Всегда **новый** промис. Его судьба зависит от обработчика:
    - вернул значение — выполнен этим значением
    - бросил ошибку — отклонён ею
    - вернул промис или thenable — повторит его результат

- key: then-async
  type: qa
  front: Вызовется ли обработчик `then` сразу, если промис уже выполнен?
  back: Нет. Обработчики всегда вызываются асинхронно — микрозадачей после текущего синхронного кода. Так порядок не зависит от того, успел ли промис выполниться.

- key: error-propagation
  type: qa
  front: Как ошибка идёт по цепочке промисов?
  back: Пропускает все `then` без обработчика ошибки и попадает в ближайший `catch` или `then(_, onRejected)`. После `catch` цепочка снова успешна, а его возвращаемое значение идёт дальше.

- key: then-ab-vs-catch
  type: code
  front: |
    Чем отличаются эти записи?
    ```js
    p.then(onOk, onFail)
    p.then(onOk).catch(onFail)
    ```
  back: Во второй `onFail` поймает и ошибку из самого `onOk`. В первой — только отклонение `p`; ошибка из `onOk` уйдёт дальше по цепочке.

- key: finally-semantics
  type: qa
  front: Что делает `finally` и меняет ли он результат?
  back: Вызывается при любом исходе, аргументов не получает. Результат проходит сквозь него без изменений. Заменить результат `finally` может только броском ошибки или отклонённым промисом.

- key: thenable
  type: term
  front: Thenable
  back: Любой объект с методом `then`. Промисы «принимают» его как промис — вызывают его `then` и повторяют результат. Это нужно для совместимости с промисами из старых библиотек.

- key: forgot-return
  type: code
  front: |
    Что не так?
    ```js
    getUser().then((user) => {
      getPosts(user.id)
    }).then((posts) => render(posts))
    ```
  back: Нет `return`. Обработчик вернул `undefined`, поэтому следующий `then` не ждёт посты и получает `posts === undefined`. А ошибка `getPosts` никем не ловится.

- key: constructor-antipattern
  type: qa
  front: Когда нужен `new Promise`, а когда это антипаттерн?
  back: Нужен на границе с API на колбэках и событиях (`setTimeout`, `onload`, Node-колбэки). Обёртка над тем, что уже возвращает промис (`fetch`, `async`-функция), — антипаттерн. Она лишняя и часто теряет ошибки.

- key: with-resolvers
  type: term
  front: '`Promise.withResolvers()`'
  back: ES2024. Возвращает `{ promise, resolve, reject }` — промис вместе с функциями управления. Удобно, когда промис выполняется из другого места — события, очереди, ответа воркера.

- key: promise-try
  type: term
  front: '`Promise.try(fn, ...args)`'
  back: ES2025. Вызывает `fn` сразу и всегда возвращает промис. Синхронная ошибка тоже становится отклонением, поэтому её ловит `catch` цепочки.

- key: unhandled-rejection
  type: qa
  front: Что происходит с отклонённым промисом без обработчика?
  back: В браузере — событие `unhandledrejection` на `window` и ошибка в консоли. Его стоит отправлять в мониторинг. В Node с версии 15 по умолчанию процесс падает.

- key: no-cancel
  type: qa
  front: Можно ли отменить промис?
  back: Нет. Промис — только представитель результата. Отменяют саму операцию через `AbortController` и `signal`. Комбинаторы (`race`, `all`) тоже ничего не отменяют, они только перестают ждать.
