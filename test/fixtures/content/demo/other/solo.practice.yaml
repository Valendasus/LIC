- key: sum
  kind: code
  level: easy
  title: Сумма
  prompt: Напишите `sum(a, b)`.
  starter: |
    function sum(a, b) {}
  hints:
    - Оператор `+`.
  tests: |
    test('складывает', () => expect(sum(2, 3)).toBe(5))
    test('с нулём', () => expect(sum(0, 4)).toBe(4))
  solution: |
    function sum(a, b) {
      return a + b
    }
  explain: Разбор суммы.
